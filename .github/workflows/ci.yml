name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Fixed test fixtures must never come from a previous run's cache.
          use-cache: false
      - name: Verify toolchain pin
        shell: bash
        run: |
          zig version
          test "$(zig version)" = "$(tr -d '\r\n' < .zigversion)"
      - name: Check formatting
        run: zig fmt --check build.zig src tests tools
      - name: Build installed libraries and tools
        run: zig build -Doptimize=${{ matrix.optimize }} -j2 --summary all
      - name: Run all regressions and eight C/C++ ABI consumers
        run: zig build test -Doptimize=${{ matrix.optimize }} -j2 --summary all
      - name: Exercise portable CRC fallback (x86)
        if: runner.arch == 'X64'
        run: zig test src/db/crc32c.zig -O ${{ matrix.optimize }} -mcpu=baseline
      - name: Exercise portable CRC fallback (Arm64)
        if: runner.arch == 'ARM64'
        # macOS's baseline is Apple M1 and includes CRC; disable it explicitly.
        run: zig test src/db/crc32c.zig -O ${{ matrix.optimize }} -mcpu=baseline-crc
      - name: Exercise x86 SSE4.2 CRC with native and LLVM backends
        if: runner.os == 'Linux'
        shell: bash
        run: |
          zig test src/db/crc32c.zig -O Debug -mcpu=x86_64+sse4_2 -fno-llvm
          zig test src/db/crc32c.zig -O Debug -mcpu=x86_64+sse4_2 -fllvm
